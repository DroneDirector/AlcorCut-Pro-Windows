name: Build Windows installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the installer as a release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Camera library (Media Foundation)
        shell: bash
        run: |
          set -o pipefail
          cmake -S native/mfcam -B native-build -A x64 2>&1 | tee native.log
          cmake --build native-build --config Release 2>&1 | tee -a native.log
          mkdir -p packaging/resources/windows/native
          cp native-build/Release/alcorcut_mf.dll packaging/resources/windows/native/
      - name: Phone native libraries (speech-to-text, voice isolation, morph cut)
        shell: bash
        run: |
          set -o pipefail
          cmake -S native/phone-win -B phone-build -A x64 -T ClangCL -DPARTS=clang 2>&1 | tee phone.log
          cmake --build phone-build --config Release 2>&1 | tee -a phone.log
          cmake -S native/phone-win -B phone-build2 -A x64 -DPARTS=msvc 2>&1 | tee -a phone.log
          cmake --build phone-build2 --config Release 2>&1 | tee -a phone.log
          cp phone-build/Release/*.dll phone-build2/Release/*.dll packaging/resources/windows/native/
          ls -la packaging/resources/windows/native
      - name: Report camera library problems
        if: failure()
        shell: bash
        run: |
          cat native.log phone.log 2>/dev/null | grep -E " error |error C|error LNK|fatal error" | head -60 > nproblems.txt || true
          msg=$(sed -e 's/%/%25/g' nproblems.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Camera library problems::${msg}"
      - name: Picture encoders
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p packaging/resources/windows/encoders
          gh release download encoders-win-v1 -R ${{ github.repository }} -p encoders-win.zip -D enc
          7z x -y -opackaging/resources/windows/encoders enc/encoders-win.zip > /dev/null
          rm -f packaging/resources/windows/encoders/freeglut.dll packaging/resources/windows/encoders/encoders-log.txt
          ls -la packaging/resources/windows/encoders
      - name: Graphics engine (ANGLE)
        shell: bash
        run: |
          # OpenGL ES on DirectX (Google's ANGLE, BSD licence), as shipped in Electron's Windows build.
          curl -sSL -o electron.zip https://github.com/electron/electron/releases/download/v33.2.0/electron-v33.2.0-win32-x64.zip
          mkdir -p packaging/resources/windows/angle
          7z e -y -opackaging/resources/windows/angle electron.zip libEGL.dll libGLESv2.dll > /dev/null
          ls -la packaging/resources/windows/angle
      - name: Build installer
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon packageReleaseMsi packageReleaseExe 2>&1 | tee build.log
      - name: Report build problems
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |What went wrong|error:|Exception|> " build.log | head -120 > problems.txt || true
          msg=$(sed -e 's/%/%25/g' problems.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build problems::${msg}"
      - name: Rename
        shell: bash
        run: |
          mkdir -p dist
          cp build/compose/binaries/main-release/msi/*.msi "dist/AlcorCutPro-Windows-1.0.${BUILD_NUMBER}.msi"
          cp build/compose/binaries/main-release/exe/*.exe "dist/AlcorCutPro-Windows-1.0.${BUILD_NUMBER}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: AlcorCutPro-Windows-1.0.${{ github.run_number }}
          path: dist/*
      - name: Release notes
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        run: |
          # The changelog lines added since the previous release (the app's update window shows them).
          prev=$(git tag -l 'v1.0.*' --sort=-v:refname | head -1)
          {
            echo "## What's new in AlcorCut Pro for Windows 1.0.${BUILD_NUMBER}"
            echo
            if [ -n "$prev" ]; then git diff "$prev" HEAD -- CHANGELOG.md | grep '^+- ' | sed 's/^+//'; else grep '^- ' CHANGELOG.md; fi
          } > notes.md
          cat notes.md
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AlcorCut Pro for Windows 1.0.${{ github.run_number }}
          body_path: notes.md
          files: dist/*

  classpath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Export jars
        run: |
          set -o pipefail
          ./gradlew --no-daemon exportClasspath 2>&1 | tee build.log
      - name: Report problems
        if: failure()
        run: |
          grep -E "^e: |What went wrong|error:|Exception|> |Could not" build.log | head -60 > problems.txt || true
          msg=$(sed -e 's/%/%25/g' problems.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build problems::${msg}"
      - name: Keep compile jars on a side branch
        # Only for compile checks outside CI; never fails the build.
        continue-on-error: true
        run: |
          cd build/classpath
          # GitHub refuses files over 100 MB.
          find . -type f -size +95M -print -delete
          ls -R | head -80
          git init -q -b classpath
          git config user.name "DroneDirector"
          git config user.email "simon@dronedirector.fo"
          git add -A
          git commit -qm "Compile jars"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" classpath
