name: Build Windows installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installer
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon packageReleaseMsi packageReleaseExe 2>&1 | tee build.log
      - name: Report build problems
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |What went wrong|error:|Exception|> " build.log | head -120 > problems.txt || true
          msg=$(sed -e 's/%/%25/g' problems.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build problems::${msg}"
      - name: Rename
        shell: bash
        run: |
          mkdir -p dist
          cp build/compose/binaries/main-release/msi/*.msi "dist/AlcorCutPro-Windows-1.0.${BUILD_NUMBER}.msi"
          cp build/compose/binaries/main-release/exe/*.exe "dist/AlcorCutPro-Windows-1.0.${BUILD_NUMBER}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: AlcorCutPro-Windows-1.0.${{ github.run_number }}
          path: dist/*
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AlcorCut Pro for Windows 1.0.${{ github.run_number }}
          files: dist/*

  classpath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon exportClasspath
      - name: Keep compile jars on a side branch
        run: |
          cd build/classpath
          rm -f skiko-awt-runtime-*.jar
          git init -q -b classpath
          git config user.name "DroneDirector"
          git config user.email "simon@dronedirector.fo"
          git add -A
          git commit -qm "Compile jars"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" classpath
