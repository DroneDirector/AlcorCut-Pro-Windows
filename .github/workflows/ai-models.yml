name: AI models for Windows

# The phone's AI models in the phone's own format (.tflite) turned into ONNX for ONNX Runtime on Windows,
# plus the YuNet face finder (MIT). Published once as the release "ai-models-win-v1".
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tools
        run: pip install --quiet "tensorflow-cpu==2.15.*" "tf2onnx==1.16.1" "onnx==1.15.0" "onnxruntime==1.17.3" "numpy<2" "protobuf==3.20.3"
      - name: Converter fix
        # Newer TFLite files leave out "fused_activation_function" on some ops (means none).
        run: |
          python - <<'PY'
          import os, re, tf2onnx
          p = os.path.join(os.path.dirname(tf2onnx.__file__), "tflite_handlers", "tfl_math.py")
          s = open(p).read()
          s = re.sub(r"^([ \t]*)activation_fn = node\.attr\['fused_activation_function'\]\.s",
                     lambda m: m.group(1) + "if 'fused_activation_function' not in node.attr:\n" + m.group(1) + "    return\n" + m.group(0), s, flags=re.M)
          open(p, "w").write(s)
          print("patched", s.count("not in node.attr"))
          PY
      - name: Download
        run: |
          set -e
          mkdir -p m && cd m
          for f in nafnet deeplab esrgan; do
            curl -fsSL -o $f.tflite "https://github.com/DroneDirector/Android-Projects/releases/download/ai-models-v1/$f.tflite"
          done
          curl -fsSL -o face_detection_yunet_2023mar.onnx "https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx"
          curl -fsSL -o YuNet-LICENSE.txt "https://raw.githubusercontent.com/opencv/opencv_zoo/main/models/face_detection_yunet/LICENSE"
          ls -la
      - name: Convert
        run: |
          set -e
          cd m
          for f in deeplab esrgan; do
            echo "== $f" >> convert-log.txt
            python -m tf2onnx.convert --tflite $f.tflite --output $f.onnx --opset 17 >> convert-log.txt 2>&1 || echo "FAILED $f" >> convert-log.txt
          done
          pip list 2>/dev/null | grep -iE "tensorflow|tf2onnx|onnx|protobuf|numpy" >> convert-log.txt
          ls -la | tee -a convert-log.txt
      - name: NAFNet
        # The phone's NAFNet file doesn't convert, so the original weights (MIT, SIDD width 32) are
        # exported straight to ONNX at the app's tile size, and checked against the phone's file.
        run: |
          pip install --quiet torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          cd m
          curl -fsSL -o NAFNet-SIDD-width32.pth "https://huggingface.co/nyanko7/nafnet-models/resolve/main/NAFNet-SIDD-width32.pth"
          python - <<'PY' 2>&1 | tee -a convert-log.txt
          import torch, torch.nn as nn, numpy as np
          class LayerNorm2d(nn.Module):
              def __init__(s, c, eps=1e-6):
                  super().__init__(); s.weight = nn.Parameter(torch.ones(c)); s.bias = nn.Parameter(torch.zeros(c)); s.eps = eps
              def forward(s, x):
                  mu = x.mean(1, keepdim=True); var = (x - mu).pow(2).mean(1, keepdim=True)
                  return s.weight.view(1, -1, 1, 1) * ((x - mu) / torch.sqrt(var + s.eps)) + s.bias.view(1, -1, 1, 1)
          class Gate(nn.Module):
              def forward(s, x):
                  a, b = x.chunk(2, dim=1); return a * b
          class Block(nn.Module):
              def __init__(s, c):
                  super().__init__(); d = c * 2
                  s.conv1 = nn.Conv2d(c, d, 1); s.conv2 = nn.Conv2d(d, d, 3, padding=1, groups=d); s.conv3 = nn.Conv2d(d // 2, c, 1)
                  s.sca = nn.Sequential(nn.AdaptiveAvgPool2d(1), nn.Conv2d(d // 2, d // 2, 1)); s.sg = Gate()
                  s.conv4 = nn.Conv2d(c, c * 2, 1); s.conv5 = nn.Conv2d(c, c, 1)
                  s.norm1 = LayerNorm2d(c); s.norm2 = LayerNorm2d(c)
                  s.beta = nn.Parameter(torch.zeros(1, c, 1, 1)); s.gamma = nn.Parameter(torch.zeros(1, c, 1, 1))
              def forward(s, inp):
                  x = s.sg(s.conv2(s.conv1(s.norm1(inp)))); x = s.conv3(x * s.sca(x)); y = inp + x * s.beta
                  x = s.conv5(s.sg(s.conv4(s.norm2(y)))); return y + x * s.gamma
          class Net(nn.Module):
              def __init__(s, width=32, mid=12, enc=(2, 2, 4, 8), dec=(2, 2, 2, 2)):
                  super().__init__()
                  s.intro = nn.Conv2d(3, width, 3, padding=1); s.ending = nn.Conv2d(width, 3, 3, padding=1)
                  s.encoders = nn.ModuleList(); s.decoders = nn.ModuleList(); s.ups = nn.ModuleList(); s.downs = nn.ModuleList()
                  c = width
                  for n in enc:
                      s.encoders.append(nn.Sequential(*[Block(c) for _ in range(n)])); s.downs.append(nn.Conv2d(c, c * 2, 2, 2)); c *= 2
                  s.middle_blks = nn.Sequential(*[Block(c) for _ in range(mid)])
                  for n in dec:
                      s.ups.append(nn.Sequential(nn.Conv2d(c, c * 2, 1, bias=False), nn.PixelShuffle(2))); c //= 2
                      s.decoders.append(nn.Sequential(*[Block(c) for _ in range(n)]))
              def forward(s, inp):
                  x = s.intro(inp); skips = []
                  for e, d in zip(s.encoders, s.downs):
                      x = e(x); skips.append(x); x = d(x)
                  x = s.middle_blks(x)
                  for dcd, up, sk in zip(s.decoders, s.ups, skips[::-1]):
                      x = dcd(up(x) + sk)
                  return s.ending(x) + inp
          net = Net().eval()
          sd = torch.load("NAFNet-SIDD-width32.pth", map_location="cpu")
          sd = sd.get("params", sd)
          print("weights:", net.load_state_dict(sd, strict=True))
          x = torch.rand(1, 3, 256, 256)
          torch.onnx.export(net, x, "nafnet.onnx", opset_version=17, input_names=["input"], output_names=["output"])
          import onnxruntime as ort
          o = ort.InferenceSession("nafnet.onnx").run(None, {"input": x.numpy()})[0]
          print("onnx vs torch max diff", float(np.abs(o - net(x).detach().numpy()).max()))
          try:
              import tensorflow as tf
              it = tf.lite.Interpreter("nafnet.tflite"); it.allocate_tensors()
              i0 = it.get_input_details()[0]; o0 = it.get_output_details()[0]
              print("phone file in", i0["shape"], "out", o0["shape"])
              it.set_tensor(i0["index"], x.numpy().reshape(i0["shape"]).astype(np.float32) if list(i0["shape"]) == [1, 3, 256, 256] else np.transpose(x.numpy(), (0, 2, 3, 1)))
              it.invoke(); t = it.get_tensor(o0["index"])
              if t.shape[-1] == 3: t = np.transpose(t, (0, 3, 1, 2))
              print("onnx vs phone file max diff", float(np.abs(o - t).max()))
          except Exception as e:
              print("phone file check skipped:", e)
          PY
          rm -f NAFNet-SIDD-width32.pth
      - name: Check
        if: always()
        run: |
          cd m
          python - <<'PY' | tee model-info.txt
          import onnxruntime as ort, numpy as np, glob
          for f in sorted(glob.glob("*.onnx")):
              s = ort.InferenceSession(f, providers=["CPUExecutionProvider"])
              print("==", f)
              feeds = {}
              for i in s.get_inputs():
                  print("  in ", i.name, i.shape, i.type)
                  shape = [d if isinstance(d, int) and d > 0 else 1 for d in i.shape]
                  feeds[i.name] = np.random.rand(*shape).astype(np.float32)
              for o in s.get_outputs(): print("  out", o.name, o.shape, o.type)
              try:
                  r = s.run(None, feeds)
                  print("  ran:", [x.shape for x in r])
              except Exception as e:
                  print("  run failed:", e)
          PY
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd m
          touch convert-log.txt model-info.txt
          sha256sum *.onnx > SHA256SUMS.txt || true
          gh release delete ai-models-win-v1 -y -R ${{ github.repository }} 2>/dev/null || true
          gh release create ai-models-win-v1 -R ${{ github.repository }} -t "AI models for Windows" -n "ONNX versions of the app's AI models (NAFNet MIT, DeepLab v3 Apache 2.0, ESRGAN Apache 2.0) and YuNet (MIT)." \
            *.onnx YuNet-LICENSE.txt model-info.txt convert-log.txt SHA256SUMS.txt
